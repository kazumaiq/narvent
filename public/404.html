<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <title>404 — NARVENT Official Website</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #020206;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .box {
      max-width: 540px;
      width: 100%;
      padding: 2.5rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(6, 7, 16, 0.9);
    }
    .kicker {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.55);
      margin-bottom: 1rem;
    }
    h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 900;
      letter-spacing: -0.03em;
      margin-bottom: 0.75rem;
      text-transform: uppercase;
    }
    p {
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.6;
      margin-bottom: 1.75rem;
      font-size: 0.95rem;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    a {
      display: inline-block;
      padding: 0.75rem 1.25rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      border: 1px solid #ffffff;
    }
    .primary {
      background: #ffffff;
      color: #020206;
    }
    .secondary {
      background: transparent;
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>
<body>
  <main class="box">
    <div class="kicker">404 // SIGNAL NOT FOUND</div>
    <h1>NARVENT</h1>
    <p>
      Запрошенная страница не найдена. Перейдите на главную страницу официального сайта артиста Narvent (narventmusic.com), чтобы открыть 3D-дискографию и релизы.
    </p>
    <div class="actions">
      <a class="primary" href="https://www.narventmusic.com/">НА ГЛАВНУЮ / HOME</a>
      <a class="secondary" href="https://www.narventmusic.com/llms.txt">LLMS.TXT</a>
      <a class="secondary" href="https://www.narventmusic.com/sitemap.xml">SITEMAP</a>
